<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModaPro Tutor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <header>
            <h1>ModaPro Tutor</h1>
            <p>Your AI Guide for Retail Success</p>
            <div class="mode-selector">
                <label for="instructor-mode">Instructor Mode:</label>
                <select id="instructor-mode">
                    <option value="soft">Soft (Onboarding Buddy)</option>
                    <option value="intermediate">Intermediate (Implementation Consultant)</option>
                    <option value="realistic">Realistic (Regional Manager)</option>
                </select>
            </div>
        </header>

        <div id="chat-history" class="chat-history">
            <!-- Messages will appear here -->
            <div class="message system">
                <div class="bubble">
                    Hello! 🌸 I'm your ModaPro Tutor. How can I help you today?
                </div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your question..." autocomplete="off">
            <button id="send-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
