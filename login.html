<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login / Register</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
   <div class="auth-box" data-mode="login">
    <!-- Theme Toggle -->
    <button id="theme-toggle" aria-label="Toggle theme">
      <i class="fa-regular fa-sun"></i>
    </button>

    <!-- Logo -->
    <div class="logo">
      <h1>Platform</h1>
    </div>

    <!-- Title & description (Login default copy) -->
    <h2 id="auth-title">Welcome, <span class="accent">learner</span>.</h2>
    <p id="auth-description">Sign in or create an account to continue.</p>

    <form novalidate>

      <!-- Always visible -->
      <div>
        <label id="email-label">Email or username</label><br>
        <input type="text" name="identifier" autocomplete="username" required>
        <p class="error" data-error-for="identifier"></p>
      </div>

      <div>
        <label>Password</label><br>
        <div class="password-field">
          <input
            type="password"
            name="password"
            id="password-input"
            autocomplete="current-password"
            required
          >
          <button type="button" class="toggle-password" aria-label="Show password">
            <i class="fa-regular fa-eye-slash"></i>
          </button>
        </div>
        <p class="error" data-error-for="password"></p>
        <p class="forgot">
          <a href="#" id="forgot-link">Forgot password?</a>
        </p>
      </div>

      <!-- Register-only fields -->
      <div class="register-fields">
        <div>
          <label>Confirm password</label><br>
          <div class="password-field">
            <input
              type="password"
              name="confirmPassword"
              id="confirm-password-input"
              autocomplete="new-password"
              required
            >
            <button type="button" class="toggle-password" aria-label="Show password">
              <i class="fa-regular fa-eye-slash"></i>
            </button>
          </div>
          <p class="error" data-error-for="confirmPassword"></p>
        </div>
        <div>
          <label>Username</label><br>
          <input type="text" name="username" autocomplete="username" required>
          <p class="error" data-error-for="username"></p>
        </div>
      </div>
      <button type="submit" id="primary-button">Continue</button>
    </form>

    <!-- Toggle Login/Register -->
    <p class="toggle-auth" id="toggle-text">
      New here?
      <a href="#" id="toggle-link">Create an account</a>
    </p>

    <!-- Optional: Guest mode (hackathon-friendly) -->
    <p class="guest">
      Just exploring?
      <a href="#" id="guest-link">Continue as a guest</a>
    </p>

    <!-- Social login -->
    <div class="social-login">
  <p>Or continue with</p>

  <div class="social-icons">
    <button type="button" class="icon-btn" aria-label="Continue with Google">
      <i class="fa-brands fa-google"></i>
    </button>

    <button type="button" class="icon-btn" aria-label="Continue with Facebook">
      <i class="fa-brands fa-facebook"></i>
    </button>

    <button type="button" class="icon-btn" aria-label="Continue with Instagram">
      <i class="fa-brands fa-instagram"></i>
    </button>
  </div>
</div>

<script>

  const registerUsername = document.querySelector('input[name="username"]');
  const confirmPassword = document.getElementById("confirm-password-input");
  const toggleText = document.getElementById("toggle-text");
  const emailLabel = document.getElementById("email-label");
  const authBox = document.querySelector(".auth-box");
  const authTitle = document.getElementById("auth-title");
  const authDesc = document.getElementById("auth-description");
  const primaryBtn = document.getElementById("primary-button");
  const forgotLink = document.getElementById("forgot-link");
  const guestLink = document.getElementById("guest-link");

  function bindToggleLink() {
    const toggle = document.getElementById("toggle-link");
    if (!toggle) return;

    toggle.addEventListener("click", (e) => {
      e.preventDefault();
      const next =
        authBox.dataset.mode === "login" ? "register" : "login";
      setMode(next);
    });
  }
  
  function setMode(mode) {
    authBox.dataset.mode = mode;

    if (mode === "login") {
      
      emailLabel.textContent = "Email or username";
      authTitle.innerHTML = 'Welcome, <span class="accent">learner</span>.';
      authDesc.textContent = "Sign in or create an account to continue.";
      primaryBtn.textContent = "Sign in";
      toggleText.innerHTML = `New here? <a href="#" id="toggle-link">Create an account</a>`;
      forgotLink.style.display = "inline";
      
      registerUsername.disabled = true;
      confirmPassword.disabled = true;
      
      bindToggleLink();
    }

    if (mode === "register") {
      registerUsername.disabled = false;
      confirmPassword.disabled = false;    
      emailLabel.textContent = "Email";
      authTitle.textContent = "Create your account";
      authDesc.innerHTML = 'And start <span class="accent">learning</span> today.';
      primaryBtn.textContent = "Sign up";
      toggleText.innerHTML = `<a href="#" id="toggle-link">I already have an account</a>`;
      forgotLink.style.display = "none";
      
      bindToggleLink();
    }
  }

  setMode("login");

  guestLink.addEventListener("click", (e) => {
    e.preventDefault();
    // Demo dashboard (placeholder)
    window.location.href = "dashboard.html";
  });

 document.querySelectorAll(".toggle-password").forEach((btn) => {
  btn.addEventListener("click", () => {
    const input = btn.previousElementSibling;
    const icon = btn.querySelector("i");

    if (input.type === "password") {
      input.type = "text";
      icon.classList.remove("fa-eye-slash");
      icon.classList.add("fa-eye");
    } else {
      input.type = "password";
      icon.classList.remove("fa-eye");
      icon.classList.add("fa-eye-slash");
    }
  });
});

const themeToggle = document.getElementById("theme-toggle");
const themeIcon = themeToggle.querySelector("i");

// Initialize icon based on current theme
function updateThemeIcon() {
  const isLight = document.documentElement.getAttribute("data-theme") === "light";
  if (isLight) {
    themeIcon.classList.remove("fa-moon");
    themeIcon.classList.add("fa-sun");
  } else {
    themeIcon.classList.remove("fa-sun");
    themeIcon.classList.add("fa-moon");
  }
}

// Set initial icon
updateThemeIcon();

themeToggle.addEventListener("click", () => {
  const isLight = document.documentElement.getAttribute("data-theme") === "light";

  if (isLight) {
    document.documentElement.removeAttribute("data-theme");
  } else {
    document.documentElement.setAttribute("data-theme", "light");
  }
  
  updateThemeIcon();
});

const form = document.querySelector("form");

function showError(fieldName, message) {
  const errorEl = document.querySelector(`[data-error-for="${fieldName}"]`);
  const inputEl = document.querySelector(`[name="${fieldName}"]`);

  if (!errorEl || !inputEl) return;

  errorEl.textContent = message;
  errorEl.classList.add("visible");
  inputEl.classList.add("error-input");
}

function clearErrors() {
  document.querySelectorAll(".error").forEach(el => {
    el.textContent = "";
    el.classList.remove("visible");
  });

  document.querySelectorAll(".error-input").forEach(el => {
    el.classList.remove("error-input");
  });
}

// Clear error for specific field when user starts typing
form.querySelectorAll("input").forEach(input => {
  input.addEventListener("input", () => {
    const errorEl = document.querySelector(`[data-error-for="${input.name}"]`);
    if (errorEl) {
      errorEl.textContent = "";
      errorEl.classList.remove("visible");
      input.classList.remove("error-input");
    }
  });
});


form.addEventListener("submit", (e) => {
  e.preventDefault();

  clearErrors();

  const mode = authBox.dataset.mode;
  const identifier = form.querySelector('[name="identifier"]').value.trim();
  const password = form.querySelector('[name="password"]').value.trim();
  const username = form.querySelector('[name="username"]')?.value.trim();
  const confirmPassword = form.querySelector('[name="confirmPassword"]')?.value.trim();

  let hasError = false;

  // Email / Username
  if (!identifier) {
    showError("identifier", "Please enter your email or username");
    hasError = true;
  }

  // Password
  if (!password) {
    showError("password", "Please enter your password");
    hasError = true;
  }

  // Register-only checks
  if (mode === "register") {
    if (!username) {
      showError("username", "Please choose a username");
      hasError = true;
    }

    if (!confirmPassword) {
      showError("confirmPassword", "Please confirm your password");
      hasError = true;
    }

    if (password && confirmPassword && password !== confirmPassword) {
      showError("confirmPassword", "Passwords do not match");
      hasError = true;
    }
  }

  if (hasError) return;

  // ✅ SUCCESS (demo)
  window.location.href = "dashboard.html";
});

// Clear errors when clicking outside
document.addEventListener("click", (e) => {
  if (!e.target.closest("input") && !e.target.closest(".error")) {
    clearErrors();
  }
});

</script>

</body>
</html>
