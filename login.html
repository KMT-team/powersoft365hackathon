<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login / Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      const stored = localStorage.getItem("theme");
      const systemLight = window.matchMedia("(prefers-color-scheme: light)").matches;
      const theme = stored ?? (systemLight ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Quicksand:wght@600&display=swap"
    rel="stylesheet">
  <script src="login.js" defer></script>
</head>

<body>
  <div class="auth-box" data-mode="login">
    <!-- Theme Toggle & Home Button -->
    <div class="auth-controls">
      <a href="index.html" id="home-btn" aria-label="Back to home">
        <i class="fa-solid fa-house"></i>
      </a>
      <button id="theme-toggle" aria-label="Toggle theme">
        <i class="fa-solid fa-sun"></i>
      </button>
    </div>

    <!-- Logo -->
    <div class="logo-text">
      <div class="auth-brand">
        <img class="brand-mark-sm" src="assets/learnflowy-logo.svg" alt="Learnflowy logo">
        <span>Learnflowy</span>
      </div>
    </div>

    <!-- Title & description (Login default copy) -->
    <h2 id="auth-title">Welcome, <span class="accent">learner</span>.</h2>
    <p id="auth-description">Sign in or create an account to continue.</p>

    <form novalidate>

      <!-- Always visible -->
      <div>
        <label id="email-label">Email or username</label><br>
        <input type="text" name="identifier" autocomplete="username" required>
        <p class="error" data-error-for="identifier"></p>
      </div>

      <div>
        <label>Password</label><br>
        <div class="password-field">
          <input type="password" name="password" id="password-input" autocomplete="current-password" required>
          <button type="button" class="toggle-password" aria-label="Show password">
            <i class="fa-regular fa-eye-slash"></i>
          </button>
        </div>
        <p class="error" data-error-for="password"></p>
        <p class="forgot">
          <a href="#" id="forgot-link">Forgot password?</a>
        </p>
      </div>

      <!-- Register-only fields -->
      <div class="register-fields">
        <div>
          <label>Confirm password</label><br>
          <div class="password-field">
            <input type="password" name="confirmPassword" id="confirm-password-input" autocomplete="new-password"
              required>
            <button type="button" class="toggle-password" aria-label="Show password">
              <i class="fa-regular fa-eye-slash"></i>
            </button>
          </div>
          <p class="error" data-error-for="confirmPassword"></p>
        </div>
        <div>
          <label>Username</label><br>
          <input type="text" name="username" autocomplete="username" required>
          <p class="error" data-error-for="username"></p>
        </div>
      </div>
      <button type="submit" id="primary-button">Continue</button>
    </form>

    <!-- Toggle Login/Register -->
    <p class="toggle-auth" id="toggle-text">
      New here?
      <a href="#" id="toggle-link">Create an account</a>
    </p>

    <!-- Optional: Guest mode (hackathon-friendly) -->
    <p class="guest">
      Just exploring?
      <a href="#" id="guest-link">Continue as a guest</a>
    </p>

    <!-- Social login -->
    <div class="social-login">
      <p>Or continue with</p>

      <div class="social-icons">
        <button type="button" class="icon-btn" aria-label="Continue with Google">
          <i class="fa-brands fa-google"></i>
        </button>

        <button type="button" class="icon-btn" aria-label="Continue with Facebook">
          <i class="fa-brands fa-facebook"></i>
        </button>

        <button type="button" class="icon-btn" aria-label="Continue with Instagram">
          <i class="fa-brands fa-instagram"></i>
        </button>
      </div>
    </div>
</body>

</html>
