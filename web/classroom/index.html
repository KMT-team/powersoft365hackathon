<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModaPro Classroom</title>

    <!-- Theme Init -->
    <script>
        (function () {
            const stored = localStorage.getItem("theme");
            const systemLight = window.matchMedia("(prefers-color-scheme: light)").matches;
            const theme = stored ?? (systemLight ? "light" : "dark");
            if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
        })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="../styles.css">
</head>

<body class="classroom">
    <!-- Main Container: 70% left (simulator) + 30% right (tutor) -->
    <div id="classroom-grid">

        <!-- LEFT SIDE: Inventory Simulation (70%) -->
        <div id="simulator-pane">

            <!-- Top Section: Inventory Panel -->
            <div class="inventory-section">
                <div class="section-header">
                    <div>
                        <h2>ModaPro Simulation</h2>
                        <p class="section-subtitle">Yes, here you can mess up!</p>
                    </div>
                    <div style="display: flex; gap: 12px; align-items: center;">
                        <button id="theme-toggle" aria-label="Toggle theme">
                            <i class="fa-solid fa-moon"></i>
                        </button>
                        <button id="sim-btn-add-item" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Add New Product
                        </button>
                    </div>
                </div>

                <!-- Inventory Grid -->
                <div id="sim-inventory-grid" class="inventory-grid">
                    <!-- Products will be rendered here by simulation.js -->
                </div>
            </div>

            <!-- HORIZONTAL DIVIDER -->
            <div class="resizable-divider horizontal"></div>

            <!-- Bottom Section: Exercise & Instructions -->
            <div class="exercise-section">
                <div class="exercise-header">
                </div>
                <div class="exercise-content">
                    <!-- Dynamic content will be loaded here -->
                </div>
            </div>
        </div>

        <!-- VERTICAL DIVIDER -->
        <div id="classroom-divider" class="resizable-divider vertical"></div>

        <!-- RIGHT SIDE: Tutor Chat (30%) -->
        <div id="tutor-pane">
            <div class="tutor-header">
                <h2>ModaPro Tutor</h2>
                <p>AI-powered guidance</p>
            </div>

            <!-- Mode Selector -->
            <div class="tutor-mode">
                <label>Learning Mode:</label>
                <select id="tutor-instructor-mode">
                    <option value="soft">Soft (Onboarding Buddy)</option>
                    <option value="intermediate">Intermediate (Consultant)</option>
                    <option value="realistic">Realistic (Manager)</option>
                </select>
            </div>

            <!-- Chat History (Scrollable) -->
            <div id="tutor-chat-history" class="tutor-chat-history">
                <div class="tutor-message tutor-system">
                    <div class="tutor-bubble">
                        Hello! I'm your ModaPro Tutor. How can I help you today?
                    </div>
                </div>
            </div>

            <!-- Chat Input -->
            <div class="tutor-input">
                <input type="text" id="tutor-user-input" placeholder="Ask me anything..." autocomplete="off" />
                <button id="tutor-send-btn" class="btn-send">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL: Add Product -->
    <div id="sim-add-item-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Product</h3>
                <button id="sim-btn-close-modal" class="modal-close">&times;</button>
            </div>
            <form id="sim-add-product-form">
                <label>Product Name *</label>
                <input type="text" name="name" required placeholder="e.g. Vintage Denim Jacket">

                <label>Category *</label>
                <select name="category" required>
                    <option value="Men">Men</option>
                    <option value="Women">Women</option>
                    <option value="Kids">Kids</option>
                    <option value="Accessories">Accessories</option>
                </select>

                <label>Price (€) *</label>
                <input type="number" name="price" step="0.01" required placeholder="0.00">

                <div class="button-group">
                    <button type="button" id="sim-btn-cancel-modal" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Product</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: Edit Product -->
    <div id="sim-edit-item-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Product</h3>
                <button id="sim-btn-close-edit-modal" class="modal-close">&times;</button>
            </div>
            <form id="sim-edit-product-form">
                <input type="hidden" name="id">

                <label>Product Name *</label>
                <input type="text" name="name" required>

                <label>Category *</label>
                <select name="category" required>
                    <option value="Men">Men</option>
                    <option value="Women">Women</option>
                    <option value="Kids">Kids</option>
                    <option value="Accessories">Accessories</option>
                </select>

                <label>Price (€) *</label>
                <input type="number" name="price" step="0.01" required>

                <div class="button-group">
                    <button type="button" id="sim-btn-cancel-edit-modal" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: Add Variant -->
    <div id="sim-variant-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add Variant</h3>
                <button id="sim-btn-close-variant-modal" class="modal-close">&times;</button>
            </div>
            <form id="sim-variant-form">
                <label>Color *</label>
                <input type="text" name="color" required placeholder="e.g. Red">

                <label>Size *</label>
                <select name="size" required>
                    <option value="XS">XS</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                    <option value="XXL">XXL</option>
                    <option value="OneSize">One Size</option>
                </select>

                <label>Stock *</label>
                <input type="number" name="stock" min="0" value="0" required>

                <div class="button-group">
                    <button type="button" id="sim-btn-cancel-variant-modal" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Variant</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: Edit Variant -->
    <div id="sim-edit-variant-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Variant</h3>
                <button id="sim-btn-close-edit-variant-modal" class="modal-close">&times;</button>
            </div>
            <form id="sim-edit-variant-form">
                <label>Color *</label>
                <input type="text" name="color" required>

                <label>Size *</label>
                <select name="size" required>
                    <option value="XS">XS</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                    <option value="XXL">XXL</option>
                    <option value="OneSize">One Size</option>
                </select>

                <label>Stock *</label>
                <input type="number" name="stock" min="0" required>

                <div class="button-group">
                    <button type="button" id="sim-btn-cancel-edit-variant-modal"
                        class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update Variant</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: Exercise Selection -->
    <div id="sim-exercise-selection-modal" class="modal hidden">
        <div class="modal-content large-modal">
            <div class="modal-header">
                <h3>Select an Exercise</h3>
            </div>
            <div id="exercise-selection-list" class="exercise-selection-grid">
                <!-- Exercises will be rendered here -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../exercises/hint-overlay.js"></script>
    <script src="../exercises/exercise-engine.js"></script>
    <script src="classroom.js"></script>
</body>

</html>
